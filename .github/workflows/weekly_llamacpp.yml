name: Weekly Upstream llama.cpp Compatibility

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  compat:
    name: Compatibility Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run Backend Integration & Fit Tests
      run: uv run pytest tests/unit/test_backends.py tests/unit/test_fit_service.py -v
